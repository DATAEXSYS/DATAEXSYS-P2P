version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: dataexsys_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: binblast122
      MYSQL_DATABASE: dataexsys
      MYSQL_USER: global
      MYSQL_PASSWORD: password123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: dataexsys_app
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dataexsys?serverTimezone=UTC
      DB_USERNAME: global
      DB_PASSWORD: password123

volumes:
  mysql_data: